<!--
  Supabase › Authentication › Emails › Templates › « Reset Password »
  Sujet à indiquer : Dolina Darts Club – choisir un nouveau mot de passe
  Puis coller tout ce qui suit dans « Message body ».
-->
<div style="background:#141414; padding:32px 16px; font-family:Arial, Helvetica, sans-serif; color:#f8f8f8;">
  <div style="max-width:520px; margin:0 auto; background:#1e1e1e; border-radius:12px; padding:28px; border:1px solid #2e2e2e;">
    <p style="margin:0 0 4px; font-size:20px; font-weight:bold; letter-spacing:0.5px; text-transform:uppercase;">Dolina Darts Club</p>
    <p style="margin:0 0 24px; font-size:13px; color:#929292;">Depuis 1984</p>
    <p style="font-size:16px; line-height:1.5;">Bonjour,</p>
    <p style="font-size:16px; line-height:1.5;">Vous avez demandé à changer le mot de passe de votre compte. Cliquez sur le bouton ci-dessous pour en choisir un nouveau :</p>
    <p style="margin:28px 0; text-align:center;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block; background:#f57a00; color:#141414; font-weight:bold; font-size:16px; text-decoration:none; padding:14px 26px; border-radius:10px;">Choisir un nouveau mot de passe</a>
    </p>
    <p style="font-size:13px; line-height:1.5; color:#929292; margin-top:28px;">Si vous n'avez rien demandé, ignorez cet email : votre mot de passe actuel reste valable.</p>
  </div>
</div>
