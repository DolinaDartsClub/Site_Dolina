<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nouveau mot de passe – Dolina Darts Club</title>
  <meta name="theme-color" content="#141414">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=__VERSION__">
  <script src="assets/js/compat.js?v=__VERSION__"></script>
  <script type="module" src="assets/js/mot-de-passe.js?v=__VERSION__"></script>
</head>
<body>

<header class="entete">
  <div class="entete__marque">
    <a class="entete__logo-lien" href="./" aria-label="Accueil du Dolina Darts Club"><img class="entete__logo" src="assets/img/logo.png" alt=""></a>
    <span class="entete__titres">
      <span class="entete__nom">Dolina Darts Club</span>
      <span class="entete__sous">Depuis 1984</span>
    </span>
  </div>
</header>

<main class="page">
  <form class="formulaire" id="formulaire" novalidate>
    <h1>Nouveau mot de passe</h1>
    <div class="message" id="message" role="alert" hidden></div>
    <label class="champ">Nouveau mot de passe<input name="password" type="password" autocomplete="new-password" minlength="8" required>
      <small>8 caractères minimum.</small></label>
    <label class="champ">Confirmer le mot de passe<input name="password2" type="password" autocomplete="new-password" required></label>
    <button class="bouton bouton--plein bouton--large" type="submit" id="envoyer">Enregistrer</button>
  </form>
</main>

</body>
</html>
