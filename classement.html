<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Classement – Dolina Darts Club</title>
  <meta name="theme-color" content="#141414">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=__VERSION__">
  <script type="module" src="assets/js/classement.js?v=__VERSION__"></script>
</head>
<body>

<header class="entete">
  <div class="entete__marque">
    <a class="entete__logo-lien" href="./" aria-label="Accueil du Dolina Darts Club"><img class="entete__logo" src="assets/img/logo.png" alt=""></a>
    <span class="entete__titres">
      <span class="entete__nom">Classement</span>
      <span class="entete__sous">Dolina Darts Club</span>
    </span>
  </div>
  <a class="bouton" id="lien-compte" href="connexion.html">Connexion</a>
</header>

<main class="page">
  <div class="message" id="message" role="alert" hidden></div>
  <div id="acces" hidden></div>
  <div id="contenu" hidden>
    <div class="mp-entete">
      <div class="rc-tete"><h1 class="section__titre">Classement du club</h1><a class="rc-lien" href="records.html">Records du club →</a></div>
      <span class="actions" style="margin:0">
        <a class="bouton bouton--petit bouton--plein" href="face-a-face.html">Face-à-face</a>
        <a class="bouton bouton--petit" href="stats.html">Mes stats</a>
      </span>
    </div>
    <nav class="t-onglets" role="tablist" aria-label="Classements">
      <button type="button" role="tab" data-vue="joueurs" aria-selected="true">Joueurs</button>
      <button type="button" role="tab" data-vue="doublettes" aria-selected="false">Doublettes</button>
    </nav>
    <div class="mp-filtres cl-filtres">
      <div class="mp-filtre" role="group" aria-label="Période" data-filtre="periode" data-liste="toujours">
        <button type="button" data-valeur="mois">Ce mois</button>
        <button type="button" data-valeur="saison" aria-pressed="true" id="btn-saison">Saison</button>
        <button type="button" data-valeur="tout">Depuis le début</button>
      </div>
      <div class="mp-filtre" role="group" aria-label="Jeu" data-filtre="jeu" data-liste="toujours">
        <button type="button" data-valeur="" aria-pressed="true">301 et 501</button>
        <button type="button" data-valeur="301">301 seulement</button>
        <button type="button" data-valeur="501">501 seulement</button>
      </div>
      <div class="mp-filtre" role="group" aria-label="Équipe" data-filtre="equipe" id="filtre-equipe">
        <button type="button" data-valeur="" aria-pressed="true">Toutes les équipes</button>
      </div>
    </div>
    <div id="classement" aria-live="polite"><p class="vide">Chargement…</p></div>
  </div>
</main>

</body>
</html>
