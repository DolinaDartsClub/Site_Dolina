<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Administration – Dolina Darts Club</title>
  <meta name="theme-color" content="#141414">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=__VERSION__">
  <script type="module" src="assets/js/admin.js?v=__VERSION__"></script>
</head>
<body>

<header class="entete">
  <div class="entete__marque">
    <a class="entete__logo-lien" href="./" aria-label="Accueil du Dolina Darts Club"><img class="entete__logo" src="assets/img/logo.png" alt=""></a>
    <span class="entete__titres">
      <span class="entete__nom">Admin</span>
      <span class="entete__sous">Dolina Darts Club</span>
    </span>
  </div>
  <a class="bouton" href="compte.html">Mon compte</a>
</header>

<main class="page page--admin">
  <div class="message" id="message" role="alert" hidden></div>

  <nav class="onglets" id="onglets" aria-label="Rubriques de l'administration" hidden>
    <button type="button" class="onglet" data-onglet="inscriptions" aria-selected="true">Inscriptions <span class="compteur" id="nb-attente">0</span></button>
    <button type="button" class="onglet" data-onglet="membres" aria-selected="false">Membres</button>
    <button type="button" class="onglet" data-onglet="equipes" aria-selected="false">Équipes</button>
    <button type="button" class="onglet" data-onglet="actus" aria-selected="false">Actualités</button>
  </nav>

  <section id="vue-inscriptions" class="section" aria-live="polite">
    <p class="vide">Chargement…</p>
  </section>

  <section id="vue-membres" class="section" hidden>
    <label class="champ">
      <span class="visuellement-cache">Rechercher un membre</span>
      <input type="search" id="recherche" placeholder="Rechercher : nom, prénom, surnom, email">
    </label>
    <div id="liste-membres" class="liste-cartes"></div>
  </section>

  <section id="vue-equipes" class="section" hidden>
    <div id="liste-equipes" class="liste-cartes"></div>
  </section>

  <section id="vue-actus" class="section" hidden>
    <div id="actus-liste">
      <button type="button" class="bouton bouton--plein" id="actu-nouvelle">+ Nouvel article</button>
      <div id="actus-articles" class="liste-cartes" style="margin-top: 16px"></div>
    </div>

    <form class="carte-info formulaire-actu" id="actu-form" novalidate hidden>
      <h2 id="actu-titre-form">Nouvel article</h2>
      <div class="message" id="actu-message" role="alert" hidden></div>
      <label class="champ">Titre *<input name="title" type="text" maxlength="160" required></label>
      <label class="champ">Catégorie *
        <select name="category" required>
          <option value="annonce">Annonce de match</option>
          <option value="resultat">Résultat</option>
          <option value="vie_club">Vie du club</option>
          <option value="evenement">Événement</option>
        </select>
      </label>
      <label class="champ">Texte
        <textarea name="body" rows="8" placeholder="Le texte de l'article. Les retours à la ligne sont conservés."></textarea>
      </label>
      <div class="champ">
        <span>Photo ou visuel</span>
        <div class="apercu-photo" id="actu-apercu" hidden>
          <img id="actu-apercu-img" alt="Aperçu de la photo">
          <button type="button" class="bouton bouton--petit bouton--danger" id="actu-retirer-photo">Retirer la photo</button>
        </div>
        <input type="file" name="photo" id="actu-photo" class="visuellement-cache" accept="image/jpeg,image/png,image/webp">
        <label for="actu-photo" class="bouton bouton--petit" style="align-self: flex-start; cursor: pointer">Choisir une photo</label>
        <small>JPEG, PNG ou WebP. La photo est réduite automatiquement avant l'envoi. Format conseillé : paysage (16:9), comme vos visuels Instagram ou LinkedIn.</small>
      </div>
      <p class="match__format" id="actu-statut"></p>
      <div class="actions">
        <button type="button" class="bouton bouton--plein" data-actu="publier" id="actu-publier">Publier</button>
        <button type="button" class="bouton" data-actu="brouillon" id="actu-brouillon">Enregistrer en brouillon</button>
        <button type="button" class="bouton" data-actu="annuler">Annuler</button>
      </div>
      <button type="button" class="lien-discret lien-danger" data-actu="supprimer" id="actu-supprimer" hidden>Supprimer cet article</button>
    </form>
  </section>
</main>

</body>
</html>
