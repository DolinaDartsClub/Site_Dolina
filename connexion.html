<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Connexion – Dolina Darts Club</title>
  <meta name="theme-color" content="#141414">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=__VERSION__">
  <script>
    // Filet de sécurité (anciens navigateurs, bloqueurs) : si le site ne se charge pas,
    // le bouton « Se connecter » explique pourquoi au lieu de ne rien faire
    window.__erreursSite = [];
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      window.__erreursSite.push(t && t.src ? 'Chargement impossible : ' + t.src.split('?')[0] : (e.message || 'Erreur inconnue'));
    }, true);
    document.addEventListener('submit', function (e) {
      if (window.__connexionPrete) return;
      e.preventDefault();
      var z = document.getElementById('message');
      var v = (navigator.userAgent.match(/OS (\d+)_(\d+)/) || []).slice(1).join('.');
      z.hidden = false;
      z.textContent = 'Le site n\'a pas pu se charger sur ce navigateur' + (v ? ' (iOS ' + v + ')' : '') + '. '
        + (window.__erreursSite.length ? 'Détail : ' + window.__erreursSite.join(' | ') + '. ' : 'Patientez quelques secondes puis réessayez. ')
        + 'Faites une capture de ce message et envoyez-la à un admin du club.';
    }, true);
  </script>
  <script type="module" src="assets/js/connexion.js?v=__VERSION__"></script>
</head>
<body>

<header class="entete">
  <div class="entete__marque">
    <a class="entete__logo-lien" href="./" aria-label="Accueil du Dolina Darts Club"><img class="entete__logo" src="assets/img/logo.png" alt=""></a>
    <span class="entete__titres">
      <span class="entete__nom">Dolina Darts Club</span>
      <span class="entete__sous">Depuis 1984</span>
    </span>
  </div>
</header>

<main class="page">
  <form class="formulaire" id="formulaire" novalidate>
    <h1>Connexion</h1>
    <div class="message" id="message" role="alert" hidden></div>
    <label class="champ">Email ou identifiant<input name="email" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="champ">Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="bouton bouton--plein bouton--large" type="submit" id="envoyer">Se connecter</button>
    <a href="mot-de-passe-oublie.html" id="oubli">Mot de passe oublié ?</a>
    <p class="centre">Pas encore de compte ? <a href="inscription.html">Créer mon compte joueur</a></p>
  </form>
</main>

</body>
</html>
